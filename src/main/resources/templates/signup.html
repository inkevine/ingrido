<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup Form</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="/js/signup.js" defer></script>
    <style>
        :root {
            --primary-cherry: #B71C1C;
            --dark-cherry: #7F0000;
            --light-cherry: #FFCDD2;
            --accent-cherry: #D32F2F;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;

        }

        section {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        form {
            position: relative;
            width: 100%;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2em;
            color: var(--primary-cherry);
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .inputbox {
            position: relative;
            width: 100%;
            height: 50px;
            margin-bottom: 25px;
        }

        .inputbox ion-icon {
            position: absolute;
            top: 15px;
            left: 10px;
            font-size: 1.2em;
            color: var(--primary-cherry);
        }

        .inputbox input {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            font-size: 1em;
            color: #333;
            padding: 0 10px 0 35px;
            transition: 0.5s;
        }

        .inputbox input:focus,
        .inputbox input:valid {
            border: 1px solid var(--primary-cherry);
        }

        .inputbox label {
            position: absolute;
            top: 15px;
            left: 35px;
            transform-origin: left;
            font-size: 1em;
            color: #999;
            pointer-events: none;
            transition: 0.5s;
        }

        .inputbox input:focus ~ label,
        .inputbox input:valid ~ label {
            top: -10px;
            left: 10px;
            font-size: 0.8em;
            padding: 0 5px;
            background: white;
            color: var(--primary-cherry);
        }

        button {
            width: 100%;
            height: 45px;
            border: none;
            outline: none;
            border-radius: 5px;
            background: var(--primary-cherry);
            color: white;
            font-size: 1em;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: var(--dark-cherry);
        }

        .register {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: #333;
        }

        .register a {
            color: var(--accent-cherry);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .register a:hover {
            text-decoration: underline;
            color: var(--dark-cherry);
        }
    </style>
</head>
<body>
<section>
    <form action="/req/signup" method="post">
        <h1>Sign Up</h1>
        <div class="inputbox">
            <ion-icon name="person-outline"></ion-icon>
            <input type="text" id="username" name="username" required>
            <label for="username">Name</label>
        </div>
        <div class="inputbox">
            <ion-icon name="mail-outline"></ion-icon>
            <input type="email" id="email" name="email" required>
            <label for="email">Email</label>
        </div>
        <div class="inputbox">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type="password" id="password" name="password" required>
            <label for="password">Password</label>
        </div>
        <div class="inputbox">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type="password" id="passwordcon" name="passwordcon" required>
            <label for="passwordcon">Confirm Password</label>
        </div>
        <button id="submit" type="submit">Sign Up</button>
        <div class="register">
            <p>Already have an account? <a href="/req/login">Log In</a></p>
        </div>
    </form>
</section>
</body>
</html>
<script>
    const submitButtton=document.getElementById('submit');
    submitButtton.addEventListener('click', (e) => {
        e.preventDefault(); // <-- THIS is crucial

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('passwordcon').value;
        const email = document.getElementById('email').value;

        if (password === confirmPassword) {
            const data = {
                username,
                email,
                password
            };

            fetch('/req/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
                .then(response => {
                    if (response.ok) {
                        alert('Registration successful!');
                        window.location.href = '/req/login';
                    } else {
                        alert('Registration failed!');
                    }
                });
        } else {
            alert('Passwords do not match!');
        }
    });



</script>
